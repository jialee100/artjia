<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>미술실 · 시작 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#DDD7CB; --paper-deep:#CEC6B6; --mat:#E6E1D6;
    --ink:#24221E; --ink-soft:#6B6459; --ink-faint:#9A9285;
    --slate:#63757C; --ochre:#9A8A63; --rule:rgba(36,34,30,.16);
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    background-color:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:300; min-height:100%;
    display:flex; flex-direction:column; align-items:center;
    padding:clamp(28px,5vh,64px) 24px 40px; position:relative;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background-image:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='300' height='300' filter='url(%23f)' opacity='0.42'/></svg>"),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.012' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='400' height='400' filter='url(%23g)' opacity='0.5'/></svg>");
    background-size:300px 300px,620px 620px; mix-blend-mode:multiply; opacity:.5;
  }
  body::after{
    content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      repeating-linear-gradient(90deg,rgba(36,34,30,.028) 0 1px,transparent 1px 4px),
      radial-gradient(120% 100% at 50% 30%,transparent 45%,rgba(80,70,55,.16) 100%);
  }
  .sheet{ position:relative; z-index:1; width:100%; max-width:980px; }

  .eyebrow{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--ink-faint); padding-bottom:14px; border-bottom:1px solid var(--rule);
  }
  .clock-block{ text-align:center; padding:clamp(30px,7vh,72px) 0 clamp(24px,4vh,44px); }
  .clock{
    font-family:'Cormorant Garamond','Gowun Batang',serif; font-weight:300;
    font-size:clamp(76px,16vw,168px); line-height:.92; letter-spacing:.02em;
    display:inline-flex; align-items:flex-start; gap:.06em;
  }
  .clock .colon{ animation:blink 2s steps(1,end) infinite; }
  @keyframes blink{ 0%,50%{opacity:1} 51%,100%{opacity:.22} }
  .clock .sec{
    font-size:.2em; letter-spacing:.14em; color:var(--ink-faint);
    margin-top:.55em; font-family:'Noto Sans KR',sans-serif;
  }
  .datum{ margin-top:14px; font-family:'Gowun Batang',serif;
    font-size:clamp(14px,1.6vw,17px); color:var(--ink-soft); letter-spacing:.06em; }

  .search-row{ display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--ink); padding-bottom:10px; }
  .search-row input{ flex:1; border:0; background:transparent; outline:none;
    font-family:'Gowun Batang',serif; font-size:19px; color:var(--ink); padding:4px 2px; }
  .search-row input::placeholder{ color:var(--ink-faint); }
  .search-row button.go{ border:0; background:transparent; cursor:pointer; color:var(--ink-soft);
    font-size:19px; line-height:1; padding:4px 2px; transition:color .2s,transform .2s; }
  .search-row button.go:hover{ color:var(--ink); transform:translateX(2px); }
  .engines{ display:flex; gap:22px; margin-top:12px; }
  .engines button{ border:0; background:transparent; cursor:pointer; padding:2px 0;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--ink-faint);
    position:relative; transition:color .2s; }
  .engines button::after{ content:''; position:absolute; left:0; right:0; bottom:-4px; height:1px;
    background:var(--slate); transform:scaleX(0); transform-origin:left; transition:transform .25s; }
  .engines button[aria-pressed="true"]{ color:var(--slate); }
  .engines button[aria-pressed="true"]::after{ transform:scaleX(1); }
  .engines button:hover{ color:var(--ink-soft); }

  .plate{
    margin-top:clamp(34px,6vh,60px); background:var(--mat);
    border:1px solid rgba(36,34,30,.14);
    box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 14px 34px -26px rgba(40,34,24,.85);
    display:grid; grid-template-columns:minmax(0,40%) 1fr;
    opacity:0; transform:translateY(10px);
    animation:rise .8s cubic-bezier(.2,.7,.3,1) .15s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:none; } }
  .frame{ padding:20px; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; border-right:1px solid rgba(36,34,30,.12); background:rgba(36,34,30,.03); min-height:240px; }
  .frame img{ display:block; max-width:100%; max-height:360px; width:auto; opacity:0;
    border:1px solid rgba(36,34,30,.22); box-shadow:0 10px 22px -18px rgba(30,26,18,.9);
    transition:opacity .6s; }
  .frame img.shown{ opacity:1; }
  .plate-status{ font-size:11px; letter-spacing:.14em; color:var(--ink-faint); text-align:center; }
  .plate-status a{ color:var(--slate); }

  .label{ padding:clamp(24px,3vw,34px); display:flex; flex-direction:column; }
  .label .kicker{ font-size:10px; letter-spacing:.28em; text-transform:uppercase;
    color:var(--ochre); margin-bottom:16px; }
  .label h1{ font-family:'Gowun Batang',serif; font-weight:700;
    font-size:clamp(21px,2.6vw,27px); line-height:1.35; letter-spacing:-.01em; }
  .label .artist{ font-family:'Gowun Batang',serif; font-size:15px; color:var(--ink-soft); margin-top:8px; }
  .label .facts{ font-size:12px; color:var(--ink-faint); margin-top:6px; letter-spacing:.03em; line-height:1.7; }
  .label hr{ border:0; border-top:1px solid var(--rule); margin:20px 0; }
  .q-tag{ font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--slate); margin-bottom:10px; }
  .question{ font-family:'Gowun Batang',serif; font-size:clamp(15px,1.8vw,17.5px);
    line-height:1.85; text-indent:-.4em; }
  .actions{ margin-top:auto; padding-top:24px; display:flex; gap:18px; flex-wrap:wrap; }
  .actions a,.actions button{ border:0; background:transparent; padding:0 0 3px; cursor:pointer;
    font-family:'Noto Sans KR',sans-serif; font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--ink-soft); text-decoration:none; border-bottom:1px solid var(--rule);
    transition:color .2s,border-color .2s; }
  .actions a:hover,.actions button:hover{ color:var(--slate); border-color:var(--slate); }

  .shortcuts{ margin-top:26px; padding-top:16px; border-top:1px solid var(--rule);
    display:flex; gap:26px; flex-wrap:wrap; }
  .shortcuts a{ font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-faint); text-decoration:none; transition:color .2s; }
  .shortcuts a:hover{ color:var(--ink); }

  :focus-visible{ outline:1.5px solid var(--slate); outline-offset:3px; }

  @media (max-width:720px){
    .plate{ grid-template-columns:1fr; }
    .frame{ border-right:0; border-bottom:1px solid rgba(36,34,30,.12); }
    .frame img{ max-height:280px; }
  }
  @media (prefers-reduced-motion:reduce){
    *{ animation:none !important; transition:none !important; }
    .plate{ opacity:1; transform:none; } .frame img{ opacity:1; }
  }
</style>
</head>

const DAYS = ["일요일","월요일","화요일","수요일","목요일","금요일","토요일"];
const pad = n => String(n).padStart(2,"0");
const $ = id => document.getElementById(id);

function tick(){
  const d = new Date();
  $("hh").textContent = pad(d.getHours());
  $("mm").textContent = pad(d.getMinutes());
  $("ss").textContent = pad(d.getSeconds());
  $("datum").textContent = d.getFullYear()+"년 "+(d.getMonth()+1)+"월 "+d.getDate()+"일 "+DAYS[d.getDay()];
  $("weekday").textContent = DAYS[d.getDay()];
}
tick(); setInterval(tick,1000);

/* 이미지 후보: 커먼즈 → 위키백과 → 커먼즈 검색으로 자동 복구 */
const filePath = (host,file,w) =>
  "https://"+host+"/wiki/Special:FilePath/"+encodeURIComponent(file)+"?width="+w;

async function commonsSearch(term){
  const url = "https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*"
    + "&generator=search&gsrnamespace=6&gsrlimit=1&gsrsearch=" + encodeURIComponent(term)
    + "&prop=imageinfo&iiprop=url&iiurlwidth=1100";
  const res = await fetch(url);
  const data = await res.json();
  const pages = data && data.query && data.query.pages;
  if(!pages) return null;
  const info = Object.values(pages)[0].imageinfo;
  return info ? (info[0].thumburl || info[0].url) : null;
}

  let i = 0;
  img.classList.remove("shown");
  status.textContent = "도판 불러오는 중";
  status.innerHTML = "도판 불러오는 중";

  function done(src){
    if(mine !== token) return;
    $("open-img").href = src;
    status.textContent = "위키미디어 공용 · 퍼블릭 도메인";
  }
  function attempt(){
    if(mine !== token) return;
    if(i < tries.length){ img.src = tries[i++]; return; }
    commonsSearch(w.search).then(url => {
      if(mine !== token) return;
      if(url){ tries.push(url); img.src = url; }
      else fail();
    }).catch(fail);
  }
  function fail(){
    if(mine !== token) return;
    img.removeAttribute("src");
    status.innerHTML = '도판을 불러오지 못했습니다 · <a href="https://commons.wikimedia.org/w/index.php?search='
      + encodeURIComponent(w.search) + '&title=Special:MediaSearch&type=image" target="_blank" rel="noopener">직접 찾아보기</a>';
  }
  img.onload = () => { if(mine===token){ img.classList.add("shown"); done(img.currentSrc || img.src); } };
  img.onerror = attempt;
  attempt();
}

function render(){
  const idx = ((dayIndex + offset) % WORKS.length + WORKS.length) % WORKS.length;
  const w = WORKS[idx];
  $("art-title").textContent = w.t;
  $("art-artist").textContent = w.a;
  $("art-facts").textContent = w.y + " · " + w.f;
  $("art-question").textContent = "\u201C" + w.q + "\u201D";
  $("art-img").alt = w.a + ", " + w.t;
  $("lookup").href = "https://artsandculture.google.com/search?q=" + encodeURIComponent(w.a + " " + w.t);
  $("plate-no").textContent = "도판 " + pad(idx+1) + " / " + pad(WORKS.length);
  loadPlate(w);
}
render();
$("next").addEventListener("click", () => { offset++; render(); });

const URLS = {
  google:"https://www.google.com/search?q=",
  naver:"https://search.naver.com/search.naver?query=",
  arts:"https://artsandculture.google.com/search?q="
};
let engine = "google";
$("engines").addEventListener("click", e => {
  const b = e.target.closest("button"); if(!b) return;
  engine = b.dataset.engine;
  [...e.currentTarget.children].forEach(x => x.setAttribute("aria-pressed", String(x===b)));
  $("q").focus();
});
function search(){
  const v = $("q").value.trim();
  if(v) location.href = URLS[engine] + encodeURIComponent(v);
}
$("go").addEventListener("click", search);
$("q").addEventListener("keydown", e => { if(e.key === "Enter") search(); });
</script>
